apiVersion: batch/v1
kind: Job
metadata:
  name: library-migrate
  namespace: library
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: library-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: sre-library:1.1.1
          imagePullPolicy: Never
          command: [alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: library-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
